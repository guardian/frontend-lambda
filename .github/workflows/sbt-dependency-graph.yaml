name: Update Dependency Graph for sbt
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        id: checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - name: Install Java
        id: java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: 11
      - name: Install sbt
        id: sbt
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      - name: Submit dependencies for backup-parameter-store
        id: submit-backup-parameter-store
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
        with:
          working-directory: ./backup-parameter-store

      - name: Submit dependencies for facia-purger
        id: submit-facia-purger
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
        with:
          working-directory: ./facia-purger

      - name: Log snapshot for backup-parameter-store
        id: validate-backup-parameter-store
        run: cat ${{ steps.submit-backup-parameter-store.outputs.snapshot-json-path }} | jq

      - name: Log snapshot for facia-purger
        id: validate-facia-purger
        run: cat ${{ steps.submit-facia-purger.outputs.snapshot-json-path }} | jq

    permissions:
      contents: write
