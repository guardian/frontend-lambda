version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      babel:
        patterns:
          - '@babel/*'
      cdk:
        patterns:
          - '@guardian/cdk'
          - 'aws-cdk'
          - 'aws-cdk-lib'
          - 'constructs'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
